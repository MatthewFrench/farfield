name: Mocked Runtime Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  mocked-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Targeted touched-surface lint gate
        run: bun run ci:targeted:lint

      - name: Targeted touched-surface typecheck gate
        run: bun run ci:targeted:typecheck

      - name: Targeted tooling governance tests gate
        run: bun run ci:targeted:governance

      - name: Targeted touched-surface critical suites gate
        run: bun run ci:targeted:critical

      - name: Targeted touched-surface performance invariants gate
        run: bun run ci:targeted:performance
